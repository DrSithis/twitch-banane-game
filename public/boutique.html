<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍌 Boutique Jeu Banane 🍌</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0e0e10;
      color: #efeff1;
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px 20px 60px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header & Logo (identique à classement.html) */
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #ffe135;
      object-fit: cover;
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(255, 225, 53, 0.25);
    }
    h1 {
      font-size: 2.2rem;
      margin: 5px 0;
      color: #ffe135;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .subtitle {
      color: #adadb8;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .subtitle .count { color: #a970ff; font-weight: 700; }

    /* Barre des réseaux sociaux (identique à classement.html) */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn-social {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, opacity 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .btn-social:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn-twitch { background-color: #9146FF; }
    .btn-discord { background-color: #5865F2; }
    .btn-tiktok { background-color: #000000; border: 1px solid #333; }
    .btn-youtube { background-color: #FF0000; }
    .btn-youtube-rediff { background-color: #CC0000; }

    /* Bandeau d'instructions */
    .instructions {
      max-width: 700px; margin: 0 auto 40px; text-align: center;
      background: #18181b; border: 1px solid #26262c; border-radius: 12px;
      padding: 14px 24px; font-size: 0.9rem; color: #adadb8;
    }
    .instructions code {
      background: #26262c; color: #ffe135; padding: 2px 8px; border-radius: 6px; font-weight: 600;
    }

    /* Sections par catégorie */
    .category-block { margin-bottom: 36px; }
    .category-block h2 {
      color: #ffe135;
      font-size: 1.3rem;
      margin: 0 0 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #26262c;
      padding-bottom: 8px;
    }
    .rewards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .reward-card {
      background: #18181b;
      border: 1px solid #26262c;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      transition: transform 0.2s, border-color 0.2s;
    }
    .reward-card:hover {
      transform: translateY(-3px);
      border-color: #ffe135;
    }
    .reward-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .reward-name {
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.3;
      color: #fff;
    }
    .reward-price {
      background: #a970ff;
      color: #1a1a1a;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .reward-desc {
      color: #adadb8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0;
      flex-grow: 1;
    }
    .reward-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid #26262c;
    }
    .reward-id {
      background: #26262c;
      color: #ffe135;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .reward-cooldown {
      color: #888780;
      font-size: 0.8rem;
    }
    .empty {
      text-align: center;
      color: #adadb8;
      padding: 60px 20px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header (identique à classement.html) -->
    <div class="header">
      <img src="https://i.imgur.com/ksTm9Tt.png" alt="DrSithis Logo" class="logo">
      <h1>🍌 Boutique Jeu Banane 🍌</h1>
      <div class="subtitle"><span class="count">{{COUNT}}</span> défis disponibles</div>

      <!-- Réseaux Sociaux -->
      <div class="social-links">
        <a href="https://www.twitch.tv/drsithis" target="_blank" class="btn-social btn-twitch">👾 Twitch</a>
        <a href="https://discord.com/invite/6rWMXX2g" target="_blank" class="btn-social btn-discord">💬 Discord</a>
        <a href="https://www.tiktok.com/@drsithis" target="_blank" class="btn-social btn-tiktok">🎵 TikTok</a>
        <a href="https://www.youtube.com/@DrSithis" target="_blank" class="btn-social btn-youtube">▶️ YouTube</a>
        <a href="https://www.youtube.com/@DrSithisRediffusion" target="_blank" class="btn-social btn-youtube-rediff">🔴 Rediffs</a>
      </div>

      <div class="instructions">
        Utilise <code>!banane_buy &lt;ID&gt;</code> dans le tchat pour débloquer un défi (copie l'ID affiché sur chaque carte).
      </div>
    </div>

    <!-- Récompenses -->
    {{CONTENT}}
  </div>

</body>
</html>
