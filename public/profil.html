<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Joueur - DrSithis Twitch Banane Game</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>


  <div class="container">
    <div class="header">
      <img src="https://i.imgur.com/ksTm9Tt.png" alt="DrSithis Logo" class="logo">

      <!-- Réseaux Sociaux -->
      <div class="social-links">
        <a href="https://www.twitch.tv/drsithis" target="_blank" class="btn-social btn-twitch">👾 Twitch</a>
        <a href="https://discord.com/invite/6rWMXX2g" target="_blank" class="btn-social btn-discord">💬 Discord</a>
        <a href="https://www.tiktok.com/@drsithis" target="_blank" class="btn-social btn-tiktok">🎵 TikTok</a>
        <a href="https://www.youtube.com/@DrSithis" target="_blank" class="btn-social btn-youtube">▶️ YouTube</a>
        <a href="https://www.youtube.com/@DrSithisRediffusion" target="_blank" class="btn-social btn-youtube-rediff">🔴 Rediffs</a>
      </div>

       <!-- Boutons de Navigation -->
	<div style="margin-bottom: 20px; display: flex; gap: 10px;">
      <a href="/" class="btn-nav">🏠 Accueil</a>
	  <a href="/classement" class="btn-nav">🏆 Classement</a>
      <a href="/boutique" class="btn-nav">🛒 Boutique</a>
      
    </div>
    </div>
   

    <!-- Carte Profil RPG -->
    <div class="profile-card">
      
      <!-- En-tête du Joueur -->
      <div class="profile-header">
        <div class="avatar-wrapper">
          <img id="player-avatar" src="https://github.com/DrSithis.png" alt="Avatar Twitch" class="profile-avatar">
        </div>
        <div class="profile-main-info">
          <h1 id="player-name" class="profile-username">Chargement...</h1>
          <div class="profile-badges">
            <span id="player-rank" class="badge badge-rank">🏆 Rang #--</span>
            <span id="player-points" class="badge badge-points">💰 -- pts</span>
          </div>
        </div>
      </div>

      <hr class="separator">

      <!-- Statistiques RPG -->
      <!-- Statistiques RPG -->
      <div class="profile-section">
        <h2>📊 Statistiques du Joueur</h2>
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-number" id="stat-shots">0</span>
            <span class="stat-label">Bananes lancées</span>
          </div>
          <div class="stat-box">
            <span class="stat-number" id="stat-misses">0</span>
            <span class="stat-label">Échecs / Ratés 🍌</span>
          </div>
          <div class="stat-box">
            <span class="stat-number" id="stat-accuracy">0%</span>
            <span class="stat-label">Taux de Précision 🎯</span>
          </div>
          <div class="stat-box">
            <span class="stat-number" id="stat-favorite-target">Aucune</span>
            <span class="stat-label">Cible Favorite 🎯</span>
          </div>
        </div>
      </div>

      <hr class="separator">

      <!-- Sac à Dos / Inventaire -->
      <div class="profile-section">
        <h2>🎒 Sac à Dos / Inventaire</h2>
        <div id="inventory-list" class="inventory-grid">
          <p class="empty-inventory">Chargement du sac à dos...</p>
        </div>
      </div>

    </div>

  </div>

  <footer style="text-align: center; margin-top: 30px; padding: 15px; font-size: 0.9em; opacity: 0.8;">
    <a href="./changelog.html" style="color: inherit; text-decoration: underline;">Changelog</a>
  </footer>
</body>
</html>
